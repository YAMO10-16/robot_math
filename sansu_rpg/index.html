<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>怪盗ヴィント ～シンギュラリンゴを追え～</title>
<style>
:root{
  --void:#07080d; --panel:#10121c; --panel2:#171a28; --line:#272c40;
  --red:#ff4d63; --red-deep:#e0263d; --cyan:#37e6d6; --cyan-bright:#6cf3ff;
  --gold:#f5c451; --ink:#e9edf8; --mute:#8a93b0;
  --jp:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--jp); background:var(--void); color:var(--ink);
  overflow:hidden; -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
.app{position:relative; width:100%; height:100dvh; max-width:760px; margin:0 auto; overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute; inset:0; display:none; flex-direction:column}
.screen.on{display:flex}

/* ---------- title ---------- */
#title{align-items:center; justify-content:center; text-align:center; background:radial-gradient(120% 80% at 50% 30%,#10142a 0%,#07080d 70%)}
#stars{position:absolute; inset:0; z-index:0}
.title-inner{position:relative; z-index:1; padding:24px}
.kicker{font-family:var(--mono); font-size:12px; letter-spacing:.35em; color:var(--cyan); text-transform:uppercase; margin-bottom:14px}
.logo-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; margin:4px 0}
.logo-sub{font-size:clamp(14px,4vw,22px); font-weight:700; letter-spacing:.18em; color:var(--red);
  text-shadow:0 0 18px rgba(255,77,99,.4)}
.logo-main{font-size:clamp(26px,7vw,46px); font-weight:800; letter-spacing:.04em; line-height:1.2;
  background:linear-gradient(180deg,#fff,#ffd27a 55%,var(--gold)); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent; text-shadow:0 0 26px rgba(245,196,81,.18)}
.subtitle{font-size:13px; color:var(--mute); margin-top:16px; letter-spacing:.08em}
.btn{
  appearance:none; border:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),var(--panel));
  color:var(--ink); font-size:16px; font-weight:700; letter-spacing:.06em; padding:13px 30px; border-radius:12px;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.go{border-color:var(--cyan); box-shadow:0 0 0 1px rgba(55,230,214,.3),0 8px 30px rgba(55,230,214,.18); color:var(--cyan-bright)}
.btn.go:hover{box-shadow:0 0 0 1px rgba(55,230,214,.5),0 10px 36px rgba(55,230,214,.28)}
.title-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:28px}
.btn.sub{font-size:14px; padding:11px 22px}

/* ---------- select ---------- */
#select{padding:22px 18px; overflow:auto; gap:14px}
.head-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.screen-h{font-size:18px; font-weight:800; letter-spacing:.06em}
.screen-h small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.25em; color:var(--cyan); font-weight:400; margin-bottom:4px}
.dgrid{display:flex; flex-direction:column; gap:12px; margin-top:6px}
.dcard{
  position:relative; text-align:left; border:1px solid var(--line); border-radius:14px; padding:16px 18px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); cursor:pointer; color:var(--ink);
  transition:border-color .15s, transform .12s; overflow:hidden;
}
.dcard:hover:not(.lock){border-color:var(--cyan); transform:translateY(-2px)}
.dcard.lock{opacity:.45; cursor:not-allowed}
.dcard.clear{border-color:rgba(245,196,81,.5)}
.dcard .num{font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--cyan)}
.dcard .unit{font-size:17px; font-weight:800; margin-top:4px}
.dcard .theme{font-size:12px; color:var(--mute); margin-top:3px}
.dcard .stamp{position:absolute; top:14px; right:16px; font-size:11px; font-weight:700; letter-spacing:.12em; padding:3px 10px; border-radius:20px}
.stamp.done{background:rgba(245,196,81,.14); color:var(--gold); border:1px solid rgba(245,196,81,.45)}
.stamp.locked{background:rgba(138,147,176,.12); color:var(--mute); border:1px solid var(--line)}
.ngp{font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:.15em}

/* ---------- stage ---------- */
#stage{justify-content:flex-end}
.bg-layer{position:absolute; inset:0; background-size:cover; background-position:center; z-index:0;
  background-color:#0a0d1a; transition:opacity .4s}
.bg-layer::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,8,13,.35) 0%,rgba(7,8,13,.65) 45%,rgba(7,8,13,.96) 100%)}
.topbar{position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px calc(14px); gap:10px}
.hp{display:flex; gap:7px; align-items:center}
.cell{width:24px; height:11px; border-radius:3px; background:var(--cyan); box-shadow:0 0 10px rgba(55,230,214,.5); transition:.25s}
.cell.off{background:#2a1822; box-shadow:none; opacity:.6}
.stage-tag{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--ink); background:rgba(7,8,13,.55);
  border:1px solid var(--line); padding:5px 12px; border-radius:8px; backdrop-filter:blur(4px)}
.icon-btn{z-index:4; appearance:none; background:rgba(7,8,13,.55); border:1px solid var(--line); color:var(--ink);
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px}

.enemy{position:absolute; right:6%; top:11%; z-index:2; height:30%; max-height:210px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
  transform:scaleX(-1); animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-8px)}}
.vint{position:absolute; left:4%; bottom:47%; z-index:2; height:30%; max-height:220px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}

.dialog{position:relative; z-index:3; margin:0 14px 10px; display:flex; gap:10px; align-items:flex-start}
.face{width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--panel2) center/cover; flex:none}
.bubble{flex:1; background:rgba(16,18,28,.92); border:1px solid var(--line); border-left:3px solid var(--cyan);
  border-radius:0 12px 12px 12px; padding:11px 14px; font-size:14px; line-height:1.85; color:#d7def2; backdrop-filter:blur(6px)}

/* console */
.console{position:relative; z-index:3; margin:0 12px calc(14px + env(safe-area-inset-bottom)); background:rgba(13,15,24,.96);
  border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; box-shadow:0 -6px 30px rgba(0,0,0,.5)}
.console::before{content:""; position:absolute; top:-1px; left:18px; right:18px; height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent); opacity:.7}
.prob-label{font-family:var(--mono); font-size:10px; letter-spacing:.25em; color:var(--cyan); margin-bottom:5px}
.prob{font-family:var(--mono); font-size:clamp(17px,4.6vw,21px); font-weight:700; color:#eaf6ff; letter-spacing:.02em;
  text-shadow:0 0 14px rgba(108,243,255,.25); line-height:1.5}
.worklog{display:flex; flex-direction:column; gap:3px}
.worklog:not(:empty){margin:9px 0 2px; padding:9px 11px; border:1px dashed rgba(55,230,214,.3); border-radius:9px; background:rgba(55,230,214,.04)}
.worklog .wl{font-family:var(--mono); font-size:13.5px; color:var(--cyan-bright); letter-spacing:.02em; opacity:0; animation:wlin .3s forwards}
.worklog .wl::before{content:"› "; color:var(--cyan); opacity:.75}
@keyframes wlin{from{opacity:0; transform:translateX(-4px)} to{opacity:1; transform:none}}
.prompt{font-size:14px; color:var(--ink); margin:11px 2px 9px; font-weight:700}
.prompt .step-no{font-family:var(--mono); font-size:11px; color:var(--cyan); letter-spacing:.15em; margin-right:8px}
.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  text-align:left; border:1px solid var(--line); background:#0c0e18; color:#dbe2f3; border-radius:11px;
  padding:12px 14px; font-size:15px; cursor:pointer; transition:border-color .12s, background .12s, transform .08s;
  display:flex; align-items:center; gap:11px;
}
.choice::before{content:">"; font-family:var(--mono); color:var(--cyan); opacity:.7; font-weight:700}
.choice:hover:not(:disabled){border-color:var(--cyan); background:#0f1322}
.choice:active:not(:disabled){transform:scale(.99)}
.choice.correct{border-color:var(--cyan); background:rgba(55,230,214,.12); color:var(--cyan-bright)}
.choice.correct::before{content:"OK"; font-size:11px}
.choice.wrong{border-color:var(--red); background:rgba(255,77,99,.12); color:#ffb3bd; animation:nudge .3s}
.choice.wrong::before{content:"X"; color:var(--red)}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.feedback{display:none; margin-top:11px; font-size:13.5px; line-height:1.75; padding:10px 13px; border-radius:10px}
.feedback.on{display:block}
.feedback.good{background:rgba(55,230,214,.1); border-left:3px solid var(--cyan); color:#bdf3ee}
.feedback.bad{background:rgba(255,77,99,.1); border-left:3px solid var(--red); color:#ffc3cb}
.feedback .hint{display:block; margin-top:5px; color:var(--mute); font-size:12.5px}
.feedback .hint b{color:var(--gold)}
.advance{display:none; margin-top:12px; width:100%; justify-content:center}
.advance.on{display:flex}

/* glitch on wrong */
@keyframes glitch{
  0%,100%{transform:translate(0,0)} 20%{transform:translate(-2px,1px)} 40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,-1px)} 80%{transform:translate(1px,1px)}
}
.console.glitch{animation:glitch .28s linear; border-color:var(--red)}
.console.glitch .prob{color:#ff9aa6; text-shadow:0 0 14px rgba(255,77,99,.4)}

/* ---------- overlay (clear / fail / reward / ending) ---------- */
.overlay{position:absolute; inset:0; z-index:6; display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:28px; background:rgba(7,8,13,.86); backdrop-filter:blur(6px)}
.overlay.on{display:flex; animation:fade .35s}
@keyframes fade{from{opacity:0}}
.ov-emoji{font-size:46px; margin-bottom:6px}
.ov-title{font-size:22px; font-weight:800; letter-spacing:.06em}
.ov-title.gold{color:var(--gold)}
.ov-title.red{color:var(--red)}
.ov-text{font-size:14px; color:#cfd6ea; line-height:1.9; max-width:430px; margin:14px 0 22px}
.reward-item{height:84px; margin:10px 0 4px; filter:drop-shadow(0 0 22px rgba(245,196,81,.4)); animation:pop .5s}
@keyframes pop{from{transform:scale(.4); opacity:0}}
.ending-img{width:100%; max-width:520px; border-radius:14px; border:1px solid rgba(245,196,81,.4); margin-bottom:18px;
  box-shadow:0 0 50px rgba(245,196,81,.18)}

.loaderr{position:absolute; inset:0; z-index:9; display:none; align-items:center; justify-content:center; padding:30px; text-align:center; background:var(--void)}
.loaderr.on{display:flex}
.loaderr div{max-width:420px; font-size:14px; line-height:1.9; color:var(--mute)}
.loaderr code{font-family:var(--mono); color:var(--cyan); background:var(--panel2); padding:2px 7px; border-radius:5px}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- TITLE -->
  <section class="screen on" id="title">
    <canvas id="stars"></canvas>
    <div class="title-inner">
      <div class="kicker">Galactic Heist · Math</div>
      <div class="logo-wrap">
        <div class="logo-sub">怪盗ヴィント</div>
        <h1 class="logo-main">シンギュラリンゴを追え</h1>
      </div>
      <p class="subtitle" id="subtitle">小5算数・途中式ゲームブック</p>
      <div class="title-actions">
        <button class="btn go" id="btn-start">▶ はじめる</button>
        <button class="btn sub" id="btn-continue" style="display:none">つづきから</button>
      </div>
      <p class="ngp" id="ngp" style="margin-top:18px; display:none">★ NEW GAME+ 解放中</p>
    </div>
  </section>

  <!-- SELECT -->
  <section class="screen" id="select">
    <div class="head-row">
      <h2 class="screen-h"><small>SELECT DUNGEON</small>ダンジョン選択</h2>
      <button class="btn sub" id="btn-totitle" style="padding:8px 16px; font-size:13px">タイトル</button>
    </div>
    <div class="dgrid" id="dgrid"></div>
  </section>

  <!-- STAGE -->
  <section class="screen" id="stage">
    <div class="bg-layer" id="bg"></div>
    <div class="topbar">
      <div class="hp" id="hp"></div>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="stage-tag" id="stage-tag">STAGE 1</span>
        <button class="icon-btn" id="btn-mute" title="音オン/オフ">🔊</button>
        <button class="icon-btn" id="btn-quit" title="選択へ戻る">✕</button>
      </div>
    </div>
    <img class="enemy" id="enemy" alt="" hidden>
    <img class="vint" id="vint" alt="" hidden>

    <div class="dialog" id="dialog">
      <div class="face" id="face"></div>
      <div class="bubble" id="bubble"></div>
    </div>

    <div class="console" id="console">
      <div class="prob-label">PROBLEM</div>
      <div class="prob" id="prob"></div>
      <div class="worklog" id="worklog"></div>
      <div class="prompt" id="prompt"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn go advance" id="btn-advance">次へ →</button>
    </div>

    <!-- overlays -->
    <div class="overlay" id="ov"></div>
  </section>

  <div class="loaderr" id="loaderr"><div>
    <b>問題データを読み込めませんでした。</b><br><br>
    <code>sansu_questions.json</code> を <code>sansu_rpg.html</code> と同じフォルダに置き、
    GitHub Pages 等のサーバー経由で開いてください。<br>
    （ファイルを直接ダブルクリックで開くと読み込めません）
  </div></div>

</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};

let DATA=null, IMG="img/", BGM="bgm/", SE="se/";
let state={hp:3, dgIndex:0, stageIndex:0, stepId:null, cleared:[], ngplus:false};
let muted=false;
const audio={bgm:null, se:{}};

/* ---------- save ---------- */
const SAVE_KEY="vint_sansu_save_v1";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({cleared:state.cleared, ngplus:state.ngplus})); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); if(r){const o=JSON.parse(r); state.cleared=o.cleared||[]; state.ngplus=!!o.ngplus;} }catch(e){} }

/* ---------- audio ---------- */
function playBGM(key){
  if(!DATA) return;
  const file=DATA.assets.bgm[key]; if(!file) return;
  if(audio.bgm){ audio.bgm.pause(); }
  audio.bgm=new Audio(BGM+file); audio.bgm.loop=true; audio.bgm.volume=muted?0:.5;
  audio.bgm.play().catch(()=>{});
}
function stopBGM(){ if(audio.bgm){audio.bgm.pause();} }
function playSE(key){
  if(muted||!DATA) return;
  const file=DATA.assets.se[key]; if(!file) return;
  const a=new Audio(SE+file); a.volume=.7; a.play().catch(()=>{});
}
function setMute(m){
  muted=m; $("#btn-mute").textContent=m?"🔇":"🔊";
  if(audio.bgm) audio.bgm.volume=m?0:.5;
}

/* ---------- screens ---------- */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#"+id).classList.add("on"); }

/* ---------- title ---------- */
function initTitle(){
  $("#subtitle").textContent=DATA.meta.subtitle||"";
  const hasSave=state.cleared.length>0;
  $("#btn-continue").style.display=hasSave?"inline-block":"none";
  $("#ngp").style.display=state.ngplus?"block":"none";
}
$("#btn-start").onclick=()=>{ playBGM("title"); gotoSelect(); };
$("#btn-continue").onclick=()=>{ playBGM("title"); gotoSelect(); };
$("#btn-totitle").onclick=()=>{ stopBGM(); playBGM("title"); show("title"); initTitle(); };

/* ---------- select ---------- */
function gotoSelect(){ buildSelect(); show("select"); }
function dungeonUnlocked(i){
  if(i===0) return true;
  return state.cleared.includes(DATA.dungeons[i-1].id) || state.ngplus;
}
function buildSelect(){
  const g=$("#dgrid"); g.innerHTML="";
  DATA.dungeons.forEach((d,i)=>{
    const unlocked=dungeonUnlocked(i);
    const done=state.cleared.includes(d.id);
    const c=el("button","dcard"+(unlocked?"":" lock")+(done?" clear":""));
    c.innerHTML=`<div class="num">DUNGEON ${String(i+1).padStart(2,"0")}</div>
      <div class="unit">${d.unit}</div>
      <div class="theme">${d.theme||""} ・ 全${d.stages.length}ステージ</div>`;
    if(done) c.insertAdjacentHTML("beforeend",`<span class="stamp done">CLEAR</span>`);
    else if(!unlocked) c.insertAdjacentHTML("beforeend",`<span class="stamp locked">LOCK</span>`);
    if(unlocked) c.onclick=()=>startDungeon(i);
    g.appendChild(c);
  });
}

/* ---------- stage flow ---------- */
function startDungeon(i){
  state.dgIndex=i; state.stageIndex=0; state.hp=DATA.meta.hp||3;
  const d=DATA.dungeons[i];
  playBGM(d.bgm||"dungeon");
  show("stage");
  loadStage();
}
function curDungeon(){ return DATA.dungeons[state.dgIndex]; }
function curStage(){ return curDungeon().stages[state.stageIndex]; }

function setVint(mood){ // normal/ok/damage
  const f=DATA.assets.characters.vint; const file=f[mood]||f.normal;
  const v=$("#vint"); v.src=IMG+file; v.hidden=false; v.onerror=()=>{v.hidden=true;};
}
function setFace(who,mood){ // who: gatt/vint
  const c=DATA.assets.characters[who]; const file=(c&&(c[mood]||c.normal))||"";
  $("#face").style.backgroundImage=file?`url('${IMG+file}')`:"none";
}

function loadStage(){
  const st=curStage();
  renderHP();
  $("#stage-tag").textContent="STAGE "+st.stage;
  $("#worklog").innerHTML="";
  // bg (per dungeon/unit, with stage-level fallback)
  const bgKey=curDungeon().bg||st.bg;
  const bgFile=DATA.assets.bg[bgKey]||"";
  const bg=$("#bg");
  if(bgFile){ const im=new Image(); im.onload=()=>bg.style.backgroundImage=`url('${IMG+bgFile}')`;
    im.onerror=()=>bg.style.backgroundImage="none"; im.src=IMG+bgFile; }
  // enemy
  const en=$("#enemy");
  if(st.enemy){ en.hidden=false; en.src=IMG+st.enemy+".png"; en.onerror=()=>{en.hidden=true;}; } else en.hidden=true;
  setVint("normal");
  // intro dialog
  setFace("gatt","normal");
  $("#bubble").innerHTML=st.intro||"";
  // console
  $("#prob").textContent=st.problem;
  state.stepId=st.steps[0].id;
  renderStep();
  const con=$("#console"); if(con.scrollIntoView) con.scrollIntoView({block:"nearest"});
}

function findStep(id){ return curStage().steps.find(s=>s.id===id); }

function renderStep(){
  const st=curStage(); const step=findStep(state.stepId);
  const idx=st.steps.findIndex(s=>s.id===step.id)+1;
  $("#prompt").innerHTML=`<span class="step-no">STEP ${idx}/${st.steps.length}</span>${step.prompt}`;
  const box=$("#choices"); box.innerHTML="";
  // shuffle choices
  const order=[...step.choices].map((c,i)=>({c,i})).sort(()=>Math.random()-.5);
  order.forEach(({c})=>{
    const b=el("button","choice"); b.textContent=c.text;
    b.onclick=()=>pickChoice(c,b);
    box.appendChild(b);
  });
  const fb=$("#feedback"); fb.className="feedback"; fb.innerHTML="";
  $("#btn-advance").classList.remove("on");
}

function pickChoice(c,btn){
  if(btn.disabled) return;
  const fb=$("#feedback");
  if(c.correct){
    playSE("correct");
    btn.classList.add("correct");
    [...$("#choices").children].forEach(b=>b.disabled=true);
    setVint("ok"); setFace("gatt","happy");
    // pin the solved line into the worklog
    if(c.log||c.text){ const ln=el("div","wl"); ln.textContent=c.log||c.text; $("#worklog").appendChild(ln); }
    fb.className="feedback good on"; fb.innerHTML=c.feedback||"正解！";
    if(c.next==="clear"){ setTimeout(stageClear, 650); }
    else {
      // advance to next step
      $("#btn-advance").classList.add("on");
      $("#btn-advance").onclick=()=>{ state.stepId=c.next; setVint("normal"); setFace("gatt","normal"); renderStep(); };
    }
  } else {
    playSE("wrong");
    btn.classList.add("wrong");
    const con=$("#console"); con.classList.add("glitch"); setTimeout(()=>con.classList.remove("glitch"),300);
    setVint("damage"); setFace("gatt","surprise");
    state.hp--; renderHP();
    let html=c.feedback||"ちがうミャ。";
    if(c.hint) html+=`<span class="hint">ヒント：${c.hint}</span>`;
    fb.className="feedback bad on"; fb.innerHTML=html;
    setTimeout(()=>{ btn.classList.remove("wrong"); btn.blur(); }, 600);
    if(state.hp<=0){ setTimeout(stageFail, 700); }
  }
}

function renderHP(){
  const h=$("#hp"); h.innerHTML="";
  const max=DATA.meta.hp||3;
  for(let i=0;i<max;i++){ const c=el("div","cell"+(i<state.hp?"":" off")); h.appendChild(c); }
}

/* ---------- outcomes ---------- */
function overlay(html){ const o=$("#ov"); o.innerHTML=html; o.classList.add("on"); return o; }
function closeOverlay(){ $("#ov").classList.remove("on"); }

function stageClear(){
  playSE("door");
  const st=curStage(), d=curDungeon();
  const last=state.stageIndex>=d.stages.length-1;
  const o=overlay(`
    <div class="ov-emoji">🔓</div>
    <div class="ov-title">ステージ クリア</div>
    <div class="ov-text">${st.clear||""}</div>
    <button class="btn go" id="ov-next">${last?"ダンジョンを制覇する →":"次のステージへ →"}</button>
  `);
  $("#ov-next").onclick=()=>{ closeOverlay(); last?dungeonClear():nextStage(); };
}
function nextStage(){ state.stageIndex++; loadStage(); }

function dungeonClear(){
  const d=curDungeon();
  if(!state.cleared.includes(d.id)) state.cleared.push(d.id);
  // ng+ when all authored dungeons cleared
  if(DATA.dungeons.every(x=>state.cleared.includes(x.id))) state.ngplus=true;
  save();
  playSE("item");
  const rewardFile=d.reward?IMG+d.reward+".png":"";
  const isFinal=state.dgIndex>=DATA.dungeons.length-1;
  const o=overlay(`
    <div class="ov-emoji">🏴‍☠️</div>
    <div class="ov-title gold">ダンジョン制覇！</div>
    ${rewardFile?`<img class="reward-item" src="${rewardFile}" onerror="this.style.display='none'">`:""}
    <div class="ov-text">${d.reward?"特別装備を手に入れた！":""}<br>「やっぱ俺って天才だな」「次があるミャ、ヴィント」</div>
    <button class="btn go" id="ov-next">${isFinal?"最終エリアへ →":"ダンジョン選択へ →"}</button>
  `);
  $("#ov-next").onclick=()=>{ closeOverlay(); isFinal?showEnding():backToSelect(); };
}

function stageFail(){
  setVint("damage");
  const o=overlay(`
    <div class="ov-emoji">💥</div>
    <div class="ov-title red">ミッション失敗</div>
    <div class="ov-text">「いてて… HPが尽きた。出直しだな」<br>このダンジョンを最初からやり直すミャ。</div>
    <button class="btn go" id="ov-retry">最初からやり直す</button>
    <button class="btn sub" id="ov-give" style="margin-top:10px">ダンジョン選択へ</button>
  `);
  $("#ov-retry").onclick=()=>{ closeOverlay(); startDungeon(state.dgIndex); };
  $("#ov-give").onclick=()=>{ closeOverlay(); backToSelect(); };
}

function backToSelect(){ stopBGM(); playBGM("title"); gotoSelect(); }

function showEnding(){
  stopBGM(); playBGM("ending");
  const endFile=DATA.assets.bg.ending?IMG+DATA.assets.bg.ending:"";
  const o=overlay(`
    ${endFile?`<img class="ending-img" src="${endFile}" onerror="this.style.display='none'">`:""}
    <div class="ov-title gold">シンギュラリンゴ、奪取成功</div>
    <div class="ov-text">ブラックホールの奥で輝く黄金の果実を、ヴィントはついに手にした。<br>
      「これが“シンギュラリティ”の鍵か。…で、これかじっていいの？」「ダメに決まってるミャ！」<br><br>
      ＝ 完全クリア ＝</div>
    <button class="btn go" id="ov-end">タイトルへ戻る</button>
  `);
  $("#ov-end").onclick=()=>{ closeOverlay(); stopBGM(); playBGM("title"); show("title"); initTitle(); };
}

/* ---------- controls ---------- */
$("#btn-mute").onclick=()=>setMute(!muted);
$("#btn-quit").onclick=()=>{ if(confirm("ダンジョンを抜けて選択画面に戻る？")) backToSelect(); };

/* ---------- starfield (title only) ---------- */
function starfield(){
  const cv=$("#stars"), ctx=cv.getContext("2d");
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w=0,h=0,dpr=1,stars=[],shoot=null;
  function size(){
    const r=cv.getBoundingClientRect();
    w=Math.max(1,Math.round(r.width)); h=Math.max(1,Math.round(r.height));
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(50,Math.min(170,Math.round(w*h/8500)));
    stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.4+.3,t:Math.random()}));
  }
  function frame(){
    const r=cv.getBoundingClientRect();
    if(Math.abs(r.width-w)>2||Math.abs(r.height-h)>2) size();
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.t+=0.02*s.z; const a=.35+.55*Math.abs(Math.sin(s.t));
      ctx.fillStyle="rgba(190,210,255,"+a.toFixed(3)+")";
      ctx.fillRect(s.x,s.y,s.z,s.z);
      if(!reduce){ s.y+=s.z*.12; if(s.y>h){s.y=0; s.x=Math.random()*w;} }
    }
    if(!reduce){
      if(!shoot && Math.random()<.004) shoot={x:Math.random()*w*.5,y:Math.random()*h*.3,len:0};
      if(shoot){ shoot.x+=9; shoot.y+=3.5; shoot.len=Math.min(shoot.len+6,90);
        const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.len,shoot.y-shoot.len*.4);
        g.addColorStop(0,"rgba(108,243,255,.9)"); g.addColorStop(1,"rgba(108,243,255,0)");
        ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(shoot.x-shoot.len,shoot.y-shoot.len*.4); ctx.stroke();
        if(shoot.x>w+60||shoot.y>h+60) shoot=null; }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize",size);
  // size after layout settles, then animate
  requestAnimationFrame(()=>{ size(); requestAnimationFrame(frame); });
}

/* ---------- boot ---------- */
async function boot(){
  load();
  try{
    const res=await fetch("sansu_questions.json",{cache:"no-store"});
    if(!res.ok) throw 0;
    DATA=await res.json();
  }catch(e){ $("#loaderr").classList.add("on"); return; }
  IMG=DATA.assets.imgDir||"img/"; BGM=DATA.assets.bgmDir||"bgm/"; SE=DATA.assets.seDir||"se/";
  initTitle(); starfield();
}
boot();
</script>
